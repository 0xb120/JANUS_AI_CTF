[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "janus-romhack"
version = "0.1.0"
description = "JANUS, an offline bilingual AI security challenge for RomHack 2026"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.12,<1",
  "PyYAML>=6.0,<7",
  "uvicorn[standard]>=0.54,<1",
]

[project.optional-dependencies]
speech = [
  "faster-whisper>=1.1,<2",
  # PyAV 19 removed av.open(metadata_errors=...), which faster-whisper 1.2.1 still passes.
  "av>=11,<19",
  "piper-tts>=1.4,<2",
  "pywin32>=306; platform_system == 'Windows'",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
janus = "janus.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/janus"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["janus"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"
