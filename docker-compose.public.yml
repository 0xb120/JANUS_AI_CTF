# Internet-facing multiplayer mode behind Caddy (automatic HTTPS):
#   docker compose -f docker-compose.yml -f docker-compose.public.yml up -d --build
#   (add -f docker-compose.hf.yml for Hugging Face, -f docker-compose.gpu.yml for a GPU)
#
# Required in .env: JANUS_PUBLIC_HOST (DNS name pointing here), JANUS_ACCESS_CODES.
# JANUS_TLS=internal uses Caddy's local CA instead of Let's Encrypt (tests, closed
# networks). Only Caddy is published. JANUS trusts X-Forwarded-* only from Caddy's fixed
# address (JANUS_CADDY_IP), not from the whole network, so other containers cannot spoof
# them. If you change JANUS_SUBNET or JANUS_CADDY_IP, JANUS_CADDY_IP must lie inside JANUS_SUBNET.
services:
  ollama:
    ports: !reset []

  janus:
    ports: !reset []
    environment:
      JANUS_ONLINE: "1"
      JANUS_PUBLIC_HOST: ${JANUS_PUBLIC_HOST:?set JANUS_PUBLIC_HOST in .env}
      JANUS_TRUSTED_PROXIES: ${JANUS_CADDY_IP:-172.30.57.10}
      JANUS_ACCESS_CODES: ${JANUS_ACCESS_CODES:?set JANUS_ACCESS_CODES in .env}

  caddy:
    image: caddy:${CADDY_VERSION:-2}
    restart: unless-stopped
    depends_on:
      janus:
        condition: service_healthy
    environment:
      JANUS_PUBLIC_HOST: ${JANUS_PUBLIC_HOST:?set JANUS_PUBLIC_HOST in .env}
      JANUS_TLS: ${JANUS_TLS:-acme}
    networks:
      default:
        ipv4_address: ${JANUS_CADDY_IP:-172.30.57.10}
    # Automatic Let's Encrypt (JANUS_TLS=acme) needs the public ports to be 80/443; non-default
    # JANUS_HTTP_PORT/JANUS_HTTPS_PORT are for JANUS_TLS=internal or ports remapped upstream.
    ports:
      - "${JANUS_HTTP_PORT:-80}:80"
      - "${JANUS_HTTPS_PORT:-443}:443"
      - "${JANUS_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

networks:
  default:
    ipam:
      config:
        - subnet: ${JANUS_SUBNET:-172.30.57.0/24}

volumes:
  caddy-data:
  caddy-config:
